[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

# Arc Testnet Configuration
[rpc_endpoints]
arc-testnet = "https://rpc.testnet.arc.network"

[etherscan]
arc-testnet = { key = "${ARC_EXPLORER_API_KEY}" }

# Testing
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 15
